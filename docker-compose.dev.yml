version: '3.8'

services:
  # Ollama: LLM local (qwen2:7b, mistral, etc.)
  # ℹ️ Auto-pulls embedding model (nomic-embed-text) and LLM (qwen2:7b) on startup
  ollama:
    image: ollama/ollama:latest
    container_name: agentic-ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-startup.sh:/ollama-startup.sh
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    entrypoint: /bin/sh -c "/ollama-startup.sh"
    networks:
      - agentic-network-dev

  # Chroma: Vector database (semantic search for PDFs)
  # ℹ️ Persistent storage in ./chroma_data (local directory, not named volume)
  chroma:
    image: chromadb/chroma:latest
    container_name: agentic-chroma-dev
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agentic-network-dev

volumes:
  ollama_data:
    driver: local

networks:
  agentic-network-dev:
    driver: bridge
