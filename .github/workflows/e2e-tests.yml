name: E2E Tests - Playwright

on:
  push:
    branches: [main, develop, ollama]
  pull_request:
    branches: [main, develop, ollama]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      ollama:
        image: ollama/ollama:latest
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/11434'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 11434:11434
      
      chroma:
        image: chromadb/chroma:latest
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v2/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: client

      - name: Pull test model into Ollama
        run: |
          echo "Waiting for Ollama API..."
          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              break
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done
          echo "Pulling qwen2:0.5b (small model for 2-core runners)..."
          curl -sf -X POST http://localhost:11434/api/pull \
            -d '{"name":"qwen2:0.5b"}' --max-time 600
          echo
          curl -s http://localhost:11434/api/tags | grep -q "qwen2:0.5b"
          echo "Model ready"

      - name: Start backend server
        run: npm run start &
        working-directory: server
        env:
          NODE_ENV: test
          VECTOR_DB: chroma
          CHROMA_URL: http://localhost:8000
          CHROMA_COLLECTION: agentic-rag
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: qwen2:0.5b
          CORS_ORIGIN: http://localhost:5173

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3001/healthz; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Start frontend dev server
        run: npm run dev &
        working-directory: client

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5173; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: client
        env:
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: client/test-results/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: 'E2E Test Results'
          path: 'client/test-results/junit.xml'
          reporter: 'java-junit'
          fail-on-error: false
