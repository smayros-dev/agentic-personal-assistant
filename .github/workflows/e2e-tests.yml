name: E2E Tests - Playwright

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs (e.g. a new push to the same PR branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # The backend runs with LLM_PROVIDER=mock (deterministic fake LLM and
    # embeddings), so no Ollama/model download is needed and the suite takes
    # about a minute. Real-model coverage: e2e-smoke-real-llm.yml (manual).
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps
        working-directory: server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Wait for Chroma to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/v2/heartbeat >/dev/null; then
              echo "Chroma is ready"
              exit 0
            fi
            echo "Waiting for Chroma... ($i/30)"
            sleep 2
          done
          echo "Chroma failed to start - container diagnostics:"
          docker ps -a
          docker logs $(docker ps -aq --filter "ancestor=chromadb/chroma:latest" | head -1) 2>&1 | tail -50
          exit 1

      # Playwright starts the backend (LLM_PROVIDER=mock) and the Vite client
      # itself, see client/playwright.config.ts.
      - name: Run Playwright tests
        run: npm run test:e2e -- --project=chromium
        working-directory: client
        env:
          CI: 'true'
          NODE_ENV: test
          VECTOR_DB: chroma
          CHROMA_URL: http://localhost:8000
          CORS_ORIGIN: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: client/test-results/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: 'E2E Test Results'
          path: 'client/test-results/junit.xml'
          reporter: 'java-junit'
          fail-on-error: false
