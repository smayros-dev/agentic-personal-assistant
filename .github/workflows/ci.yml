name: CI - Lint & Test

on:
  push:
    branches: [main, develop, ollama]
  pull_request:
    branches: [main, develop, ollama]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps
        working-directory: server

      - name: Install client dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Lint server
        run: npm run lint
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Check formatting (server)
        run: npm run format:check
        working-directory: server
        continue-on-error: true

      - name: Check formatting (client)
        run: npm run format:check
        working-directory: client
        continue-on-error: true

  test-server:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: server

      - name: Run unit tests
        run: npm run test:run
        working-directory: server

      - name: Generate coverage report
        run: npm run test:coverage 2>&1 || true
        working-directory: server

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 30

  test-client:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Run unit tests
        run: npm run test:run
        working-directory: client

      - name: Generate coverage report
        run: npm run test:coverage 2>&1 || true
        working-directory: client

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: client/coverage
          retention-days: 30

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-server, test-client]

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install client dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps
        working-directory: server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: client

      - name: Pull test model into Ollama
        run: |
          echo "Waiting for Ollama API..."
          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              break
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done
          echo "Pulling qwen2:0.5b (small model for 2-core runners)..."
          curl -sf -X POST http://localhost:11434/api/pull \
            -d '{"name":"qwen2:0.5b"}' --max-time 600
          echo
          curl -s http://localhost:11434/api/tags | grep -q "qwen2:0.5b"
          echo "Model ready"

      - name: Wait for Chroma to be ready
        run: |
          echo "Waiting for Chroma API..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/v2/heartbeat >/dev/null ||
               curl -sf http://localhost:8000/api/v1/heartbeat >/dev/null ||
               curl -sf http://localhost:8000/ >/dev/null; then
              echo "Chroma is ready"
              exit 0
            fi
            echo "Waiting for Chroma... ($i/30)"
            sleep 2
          done
          echo "Chroma failed to start - container diagnostics:"
          docker ps -a
          docker logs $(docker ps -aq --filter "ancestor=chromadb/chroma:latest" | head -1) 2>&1 | tail -50
          exit 1

      - name: Start backend server
        run: npm run start &
        working-directory: server
        env:
          NODE_ENV: test
          VECTOR_DB: chroma
          CHROMA_URL: http://localhost:8000
          CHROMA_COLLECTION: agentic-rag
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: qwen2:0.5b
          CORS_ORIGIN: http://localhost:5173

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3001/healthz; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Start frontend dev server
        run: npm run dev &
        working-directory: client
        env:
          VITE_API_URL: http://localhost:3001

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5173; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: client
        env:
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: client/test-results/
          retention-days: 30

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, test-server, test-client, test-e2e]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✅ CI Pipeline Summary:"
          echo "- Lint: Completed"
          echo "- Server Tests: Completed"
          echo "- Client Tests: Completed"
          echo "- E2E Tests: Completed"
          
          if ${{ needs.lint.result == 'failure' || needs.test-server.result == 'failure' || needs.test-client.result == 'failure' || needs.test-e2e.result == 'failure' }}; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed!"
            exit 0
          fi
