name: CI - Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs (e.g. a new push to the same PR branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps
        working-directory: server

      - name: Install client dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Lint server
        run: npm run lint
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Check formatting (server)
        run: npm run format:check
        working-directory: server
        continue-on-error: true

      - name: Check formatting (client)
        run: npm run format:check
        working-directory: client
        continue-on-error: true

  test-server:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: server

      - name: Run unit tests
        run: npm run test:run
        working-directory: server

      - name: Generate coverage report
        run: npm run test:coverage 2>&1 || true
        working-directory: server

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 30

  test-client:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Run unit tests
        run: npm run test:run
        working-directory: client

      - name: Generate coverage report
        run: npm run test:coverage 2>&1 || true
        working-directory: client

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: client/coverage
          retention-days: 30

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, test-server, test-client]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✅ CI Pipeline Summary:"
          echo "- Lint: Completed"
          echo "- Server Tests: Completed"
          echo "- Client Tests: Completed"
          echo "- E2E Tests: see the E2E Tests - Playwright workflow"
          
          if ${{ needs.lint.result == 'failure' || needs.test-server.result == 'failure' || needs.test-client.result == 'failure' }}; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed!"
            exit 0
          fi
