name: E2E Smoke - Real LLM

# Manually triggered: runs the @smoke E2E test against a real Ollama model
# (the regular E2E workflow uses the mock LLM).
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama chat model to test'
        required: true
        default: 'qwen2:0.5b'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps
        working-directory: server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Pull models into Ollama
        env:
          MODEL: ${{ inputs.model }}
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done
          for m in "$MODEL" nomic-embed-text; do
            echo "Pulling $m..."
            curl -sf -X POST http://localhost:11434/api/pull -d "{\"name\":\"$m\"}" --max-time 900 >/dev/null
          done
          curl -s http://localhost:11434/api/tags

      - name: Wait for Chroma to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/api/v2/heartbeat >/dev/null && exit 0
            echo "Waiting for Chroma... ($i/30)"
            sleep 2
          done
          exit 1

      - name: Run smoke test against the real model
        run: npm run test:e2e -- --project=chromium --grep @smoke
        working-directory: client
        env:
          CI: 'true'
          E2E_REAL_LLM: '1'
          NODE_ENV: test
          VECTOR_DB: chroma
          CHROMA_URL: http://localhost:8000
          CHROMA_COLLECTION: e2e-smoke
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: ${{ inputs.model }}
          CORS_ORIGIN: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-smoke
          path: client/playwright-report/
          retention-days: 14
